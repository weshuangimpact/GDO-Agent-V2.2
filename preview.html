<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDO 動態沙盒預覽 (Kinematic & Physics Sandbox) v4.1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        :root { --primary: #004494; --bg: #1e1e1e; --text: #d4d4d4; --panel: #2d2d2d; }
        body { font-family: monospace; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #111; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .controls { display: flex; gap: 15px; align-items: center; }
        button { background: var(--primary); color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; font-family: monospace; }
        button:hover { background: #0055b3; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        .status { padding: 5px 10px; background: #000; border-radius: 4px; font-size: 0.9rem; color: #00ff00; min-width: 250px; text-align: center; }
        .main-view { display: flex; flex-grow: 1; height: calc(100vh - 60px); }
        #canvas-container { flex-grow: 1; position: relative; }
        .sidebar { width: 350px; background: var(--panel); border-left: 1px solid #444; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; background: #222; border-bottom: 1px solid #444; font-weight: bold; font-size: 0.9rem; }
        pre { margin: 0; padding: 15px; overflow-y: auto; font-size: 0.8rem; color: #9cdcfe; flex-grow: 1; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="header">
    <h1>GDO 幾何預覽與物理驗證沙盒 (v4.1)</h1>
    <div class="controls">
        <div id="statusDisplay" class="status">STATE: IDLE</div>
        <button id="runBtn" onclick="executeBT()">▶️ 執行全自動排程</button>
        <button onclick="location.reload()" style="background: #666;">🔄 重置場景</button>
    </div>
</div>

<div class="main-view">
    <div id="canvas-container"></div>
    <div class="sidebar">
        <div class="sidebar-header">接收的 Candidate BT (JSON)</div>
        <pre id="jsonDisplay">等待資料載入...</pre>
    </div>
</div>

<script>
    let scene, camera, renderer, world;
    let environmentObjects = {}; // 物件字典
    let gripperBody, gripperMesh;
    let graspConstraint = null;
    let isExecuting = false;
    let btData = null;
    let gripperTargetPos = new CANNON.Vec3(0, 1.5, 0);

    init();
    animate();

    function init() {
        // --- 1. Three.js 場景設定 ---
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 3, 3);
        camera.lookAt(0, 0, 0);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(2, 5, 2);
        dirLight.castShadow = true;
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(5, 20, 0x555555, 0x444444));

        // --- 2. Cannon.js 物理世界 ---
        world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 20; // 提高解算精度

        // 地板
        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);
        const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshPhongMaterial({ color: 0x333333 }));
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // --- 3. 建立場景物件庫 ---
        
        // A. 左上角齒輪 (gear_top_left)
        createPhysicalObject("gear_top_left", new THREE.CylinderGeometry(0.15, 0.15, 0.05, 32), new CANNON.Cylinder(0.15, 0.15, 0.05, 16), 0xaaaaaa, new CANNON.Vec3(-0.4, 0.025, -0.3), 2, true);

        // B. 左側彈簧 (spring_left) - 用長方體代替
        createPhysicalObject("spring_left", new THREE.BoxGeometry(0.1, 0.1, 0.3), new CANNON.Box(new CANNON.Vec3(0.05, 0.05, 0.15)), 0x555555, new CANNON.Vec3(-0.35, 0.05, 0.1), 1);

        // C. 底部螺紋軸 (shaft_bottom)
        createPhysicalObject("shaft_bottom", new THREE.BoxGeometry(0.4, 0.05, 0.05), new CANNON.Box(new CANNON.Vec3(0.2, 0.025, 0.025)), 0xcccccc, new CANNON.Vec3(0.0, 0.025, 0.4), 1);

        // D. 中央結合體 (blue_cylindrical_component) - 複合剛體 (Compound Body)
        createCompoundObject("blue_cylindrical_component");

        // --- 4. 建立平行雙爪夾具 (Two-Finger Gripper) ---
        createGripper();

        // 載入 JSON
        loadBTData();
        window.addEventListener('resize', onWindowResize, false);
    }

    // 建立單一物件
    function createPhysicalObject(id, geometry, shape, color, position, mass, isCylinder = false) {
        const mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: color }));
        mesh.castShadow = true;
        scene.add(mesh);

        const body = new CANNON.Body({ mass: mass });
        
        // Cannon.js 的 Cylinder 預設朝 Z 軸，需旋轉以匹配 Three.js 的 Y 軸
        if (isCylinder) {
            const quat = new CANNON.Quaternion();
            quat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            body.addShape(shape, new CANNON.Vec3(0, 0, 0), quat);
        } else {
            body.addShape(shape);
        }
        
        body.position.copy(position);
        world.addBody(body);
        
        environmentObjects[id] = { mesh, body };
    }

    // 建立複合結合件 (藍色圓柱 + 灰色鐵塊)
    function createCompoundObject(id) {
        // 物理 Body (總質量)
        const compBody = new CANNON.Body({ mass: 5 });
        
        // 灰色鐵塊 Shape & Offset
        const boxShape = new CANNON.Box(new CANNON.Vec3(0.15, 0.1, 0.15));
        compBody.addShape(boxShape, new CANNON.Vec3(0.15, 0, 0));
        
        // 藍色圓柱 Shape & Offset (Cannon Cylinder 朝 Z，需轉向 X)
        const cylShape = new CANNON.Cylinder(0.1, 0.1, 0.25, 16);
        const cylQuat = new CANNON.Quaternion();
        cylQuat.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
        compBody.addShape(cylShape, new CANNON.Vec3(-0.125, 0, 0), cylQuat);

        compBody.position.set(-0.1, 0.1, 0);
        world.addBody(compBody);

        // 視覺 Group
        const group = new THREE.Group();
        const boxMesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.3), new THREE.MeshPhongMaterial({ color: 0x888888 }));
        boxMesh.position.set(0.15, 0, 0);
        boxMesh.castShadow = true;
        
        const cylMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.25, 32), new THREE.MeshPhongMaterial({ color: 0x0055ff }));
        cylMesh.rotation.z = Math.PI / 2;
        cylMesh.position.set(-0.125, 0, 0);
        cylMesh.castShadow = true;

        group.add(boxMesh);
        group.add(cylMesh);
        scene.add(group);

        environmentObjects[id] = { mesh: group, body: compBody };
    }

    function createGripper() {
        const group = new THREE.Group();
        const mat = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
        
        // 基座
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.1), mat);
        base.position.y = 0.1;
        // 左爪
        const fingerL = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.1), mat);
        fingerL.position.set(-0.09, 0, 0);
        // 右爪
        const fingerR = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.1), mat);
        fingerR.position.set(0.09, 0, 0);

        group.add(base); group.add(fingerL); group.add(fingerR);
        scene.add(group);
        gripperMesh = group;

        // 物理 (簡化為一個包圍盒即可，用 LockConstraint 鎖定)
        gripperBody = new CANNON.Body({ 
            mass: 0, type: CANNON.Body.KINEMATIC, 
            shape: new CANNON.Box(new CANNON.Vec3(0.1, 0.1, 0.05)) 
        });
        gripperBody.position.copy(gripperTargetPos);
        world.addBody(gripperBody);
    }

    function loadBTData() {
        const rawData = localStorage.getItem('gdo_candidate_bt');
        if (rawData) {
            btData = JSON.parse(rawData);
            document.getElementById('jsonDisplay').innerText = JSON.stringify(btData, null, 2);
        } else {
            document.getElementById('jsonDisplay').innerText = "// 尚未接收到 localStorage 資料";
            document.getElementById('runBtn').disabled = true;
        }
    }

    // --- 非同步行為樹排程器 (支援多物件) ---
    async function executeBT() {
        if (isExecuting || !btData || !btData.Nodes) return;
        isExecuting = true;
        document.getElementById('runBtn').disabled = true;
        
        try {
            // Drop-off 區域 (右側)
            let dropX = 0.6;
            
            // 遍歷所有 Sequence 子任務
            for (let i = 0; i < btData.Nodes.length; i++) {
                const task = btData.Nodes[i];
                if (!task.Nodes) continue;

                const graspNode = task.Nodes.find(n => n.Node === "FindGraspPoint");
                if (!graspNode) continue;

                const targetId = graspNode.Target;
                const offset = graspNode.offset_xyz || [0, 0, 0];
                const targetObj = environmentObjects[targetId];

                if (!targetObj) {
                    console.warn("找不到物件: " + targetId);
                    continue;
                }

                updateStatus(`[${i+1}/${btData.Nodes.length}] APPROACHING: ${targetId}`);
                
                // 1. 移動至正上方
                await moveGripper(offset[0], 0.8, offset[2], 0.05);
                // 2. 下降
                await moveGripper(offset[0], offset[1], offset[2], 0.02);

                updateStatus(`[${i+1}/${btData.Nodes.length}] GRASPING...`);
                await sleep(400);
                
                // 使用 LockConstraint (剛性鎖定)，消除晃動
                graspConstraint = new CANNON.LockConstraint(gripperBody, targetObj.body);
                world.addConstraint(graspConstraint);
                await sleep(200);

                updateStatus(`[${i+1}/${btData.Nodes.length}] LIFTING...`);
                await moveGripper(offset[0], 0.8, offset[2], 0.03);

                updateStatus(`[${i+1}/${btData.Nodes.length}] MOVING TO DROP ZONE...`);
                await moveGripper(dropX, 0.8, 0, 0.05);

                updateStatus(`[${i+1}/${btData.Nodes.length}] LOWERING TO PLACE...`);
                // 3. 放下至桌面高度，避免自由落體砸壞
                await moveGripper(dropX, 0.2, 0, 0.03);

                updateStatus(`[${i+1}/${btData.Nodes.length}] RELEASING...`);
                world.removeConstraint(graspConstraint);
                graspConstraint = null;
                await sleep(300);

                // 退回高空
                await moveGripper(dropX, 0.8, 0, 0.05);
                
                // 錯開放置位置，避免下一個物件砸到前一個
                dropX += 0.2; 
            }

            updateStatus("STATE: ALL TASKS ACCOMPLISHED (BIN EMPTY)");
            await moveGripper(0, 1.5, 0, 0.05);
            
        } catch (e) {
            updateStatus("ERROR: " + e.message);
        } finally {
            isExecuting = false;
        }
    }

    function moveGripper(x, y, z, speed) {
        return new Promise(resolve => {
            const target = new CANNON.Vec3(x, y, z);
            const interval = setInterval(() => {
                const diff = target.vsub(gripperTargetPos);
                if (diff.length() < 0.02) {
                    gripperTargetPos.copy(target);
                    clearInterval(interval);
                    resolve();
                } else {
                    diff.normalize();
                    gripperTargetPos.x += diff.x * speed;
                    gripperTargetPos.y += diff.y * speed;
                    gripperTargetPos.z += diff.z * speed;
                }
            }, 16);
        });
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function updateStatus(msg) { document.getElementById('statusDisplay').innerText = msg; }

    function animate() {
        requestAnimationFrame(animate);
        world.step(1 / 60);

        // 同步所有環境物件的 物理 -> 視覺
        for (let key in environmentObjects) {
            const obj = environmentObjects[key];
            obj.mesh.position.copy(obj.body.position);
            obj.mesh.quaternion.copy(obj.body.quaternion);
        }

        // 更新夾爪
        gripperBody.position.copy(gripperTargetPos);
        gripperMesh.position.copy(gripperBody.position);
        gripperMesh.quaternion.copy(gripperBody.quaternion);

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }
</script>
</body>
</html>
