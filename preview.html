<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GDO 動態沙盒預覽 (Kinematic & Physics Sandbox) v4.2.2 - fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <style>
        :root { --primary: #004494; --bg: #1e1e1e; --text: #d4d4d4; --panel: #2d2d2d; }
        body { font-family: monospace; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .header { background: #111; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 1.2rem; color: #fff; }
        .controls { display: flex; gap: 15px; align-items: center; }
        button { background: var(--primary); color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.2s; font-family: monospace; }
        button:hover { background: #0055b3; }
        button:disabled { background: #555; cursor: not-allowed; color: #888; }
        .status { padding: 5px 10px; background: #000; border-radius: 4px; font-size: 0.9rem; color: #00ff00; min-width: 250px; text-align: center; }
        .main-view { display: flex; flex-grow: 1; height: calc(100vh - 60px); }
        #canvas-container { flex-grow: 1; position: relative; }
        .sidebar { width: 420px; background: var(--panel); border-left: 1px solid #444; display: flex; flex-direction: column; }
        .sidebar-header { padding: 10px; background: #222; border-bottom: 1px solid #444; font-weight: bold; font-size: 0.9rem; display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header .hint { font-weight: normal; color: #888; font-size: 0.75rem; }
        pre { margin: 0; padding: 15px; overflow-y: auto; font-size: 0.8rem; color: #9cdcfe; flex-grow: 1; white-space: pre-wrap; }
        #btInput {
            width: 100%; box-sizing: border-box; height: 160px; resize: vertical;
            background: #1a1a1a; color: #ce9178; border: 1px solid #444; font-family: monospace;
            font-size: 0.78rem; padding: 10px;
        }
        .input-panel { padding: 10px; border-bottom: 1px solid #444; display: flex; flex-direction: column; gap: 8px; }
        .input-panel .row { display: flex; gap: 8px; }
        .input-panel button { flex: 1; }
        #loadMsg { font-size: 0.75rem; min-height: 1em; }
        #loadMsg.error { color: #ff6b6b; }
        #loadMsg.ok { color: #6bff8f; }
    </style>
</head>
<body>

<div class="header">
    <h1>GDO 幾何預覽與物理驗證沙盒 (v4.2.2 - 姿態/干涉/資料載入修復版)</h1>
    <div class="controls">
        <div id="statusDisplay" class="status">STATE: IDLE</div>
        <button id="runBtn" onclick="executeBT()">▶️ 執行全自動排程</button>
        <button onclick="location.reload()" style="background: #666;">🔄 重置場景</button>
    </div>
</div>

<div class="main-view">
    <div id="canvas-container"></div>
    <div class="sidebar">
        <div class="input-panel">
            <div class="sidebar-header" style="padding:0; background:none; border:none;">
                貼上 Candidate BT (JSON) <span class="hint">會存入 localStorage 並套用</span>
            </div>
            <textarea id="btInput" spellcheck="false" placeholder="貼上 BT JSON..."></textarea>
            <div class="row">
                <button onclick="applyBTFromTextarea()">✅ 套用 JSON</button>
                <button onclick="clearStoredBT()" style="background:#666;">🗑️ 清除已存資料</button>
            </div>
            <div id="loadMsg"></div>
        </div>
        <div class="sidebar-header">目前使用中的 BT (唯讀)</div>
        <pre id="jsonDisplay">等待資料載入...</pre>
    </div>
</div>

<script>
    let scene, camera, renderer, world;
    let environmentObjects = {}; 
    let gripperBody, gripperMesh;
    let graspConstraint = null;
    let isExecuting = false;
    let btData = null;
    let gripperTargetPos = new CANNON.Vec3(0, 1.5, 0);
    let gripperTargetQuat = new CANNON.Quaternion(); 

    // Top surface of the finite "bin" floor box (see createBinBoundary: y=0.01, height=0.02 -> top = 0.02).
    // Object placement Y values below are authored as (BIN_FLOOR_TOP + object's own resting half-extent)
    // so objects start sitting ON the floor instead of partially embedded in it.
    const BIN_FLOOR_TOP = 0.02;

    init();
    animate();

    function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a2a);
        
        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 100);
        camera.position.set(0, 2.5, 2.5);
        camera.lookAt(0, 0, 0);
        
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(2, 5, 2);
        dirLight.castShadow = true;
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(5, 20, 0x555555, 0x444444));

        world = new CANNON.World();
        world.gravity.set(0, -9.82, 0);
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 30;

        const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);
        const groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshPhongMaterial({ color: 0x333333 }));
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        createBinBoundary();
        buildEnvironmentObjects();
        createGripper();
        loadBTData();
        window.addEventListener('resize', onWindowResize, false);
    }

    function createBinBoundary() {
        const binColor = 0xffffff;
        const mat = new THREE.MeshPhongMaterial({ color: binColor, transparent: true, opacity: 0.3, side: THREE.DoubleSide });
        
        createStaticBox(0, 0.01, 0, 1.2, 0.02, 0.9, mat);
        createStaticBox(0, 0.15, -0.45, 1.2, 0.3, 0.02, mat);
        createStaticBox(0, 0.15, 0.45, 1.2, 0.3, 0.02, mat);
        createStaticBox(-0.6, 0.15, 0, 0.02, 0.3, 0.9, mat);
        createStaticBox(0.6, 0.15, 0, 0.02, 0.3, 0.9, mat);
    }

    function createStaticBox(x, y, z, w, h, d, material) {
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
        mesh.position.set(x, y, z);
        scene.add(mesh);
        const body = new CANNON.Body({ mass: 0, shape: new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2)) });
        body.position.set(x, y, z);
        world.addBody(body);
    }

    function buildEnvironmentObjects() {
        const gearMat = 0x888888;
        const shaftMat = 0xaaaaaa;
        const springMat = 0x555555;

        // A. 齒輪 (Gears) - 半高 0.015 -> 貼地 Y = BIN_FLOOR_TOP + 0.015
        const gearGeom = new THREE.CylinderGeometry(0.12, 0.12, 0.03, 32);
        const gearShape = new CANNON.Cylinder(0.12, 0.12, 0.03, 16);
        createPhysicalObject("gear_top_left", gearGeom, gearShape, gearMat, new CANNON.Vec3(-0.4, BIN_FLOOR_TOP + 0.015, -0.28), 2, true);
        createPhysicalObject("gear_bottom_left", gearGeom, gearShape, gearMat, new CANNON.Vec3(-0.4, BIN_FLOOR_TOP + 0.015, 0.28), 2, true);
        createPhysicalObject("gear_top_right", gearGeom, gearShape, gearMat, new CANNON.Vec3(0.4, BIN_FLOOR_TOP + 0.015, -0.28), 2, true);

        // B. 金屬圓軸 (Shafts) - 躺平時貼地高度 = 半徑 0.025 -> Y = BIN_FLOOR_TOP + 0.025
        const shaftGeom = new THREE.CylinderGeometry(0.025, 0.025, 0.4, 16);
        const shaftShape = new CANNON.Cylinder(0.025, 0.025, 0.4, 12);
        createPhysicalObject("shaft_top", shaftGeom, shaftShape, shaftMat, new CANNON.Vec3(0.0, BIN_FLOOR_TOP + 0.025, -0.38), 1.5, true, [0, 0, Math.PI/2]);
        createPhysicalObject("shaft_bottom", shaftGeom, shaftShape, shaftMat, new CANNON.Vec3(0.0, BIN_FLOOR_TOP + 0.025, 0.38), 1.5, true, [0, 0, Math.PI/2]);
        createPhysicalObject("shaft_right", shaftGeom, shaftShape, shaftMat, new CANNON.Vec3(0.42, BIN_FLOOR_TOP + 0.025, 0.1), 1.5, true, [Math.PI/2, 0, 0]);

        // C. 彈簧 (Springs) - 半徑 0.04 -> Y = BIN_FLOOR_TOP + 0.04
        const springGeom = new THREE.CylinderGeometry(0.04, 0.04, 0.25, 16);
        const springShape = new CANNON.Cylinder(0.04, 0.04, 0.25, 12);
        createPhysicalObject("spring_top_left", springGeom, springShape, springMat, new CANNON.Vec3(-0.18, BIN_FLOOR_TOP + 0.04, -0.15), 1, true, [Math.PI/2, Math.PI/4, 0]);
        createPhysicalObject("spring_bottom_left", springGeom, springShape, springMat, new CANNON.Vec3(-0.18, BIN_FLOOR_TOP + 0.04, 0.15), 1, true, [Math.PI/2, -Math.PI/4, 0]);
        createPhysicalObject("spring_top_right", springGeom, springShape, springMat, new CANNON.Vec3(0.22, BIN_FLOOR_TOP + 0.04, -0.15), 1, true, [Math.PI/2, -Math.PI/4, 0]);
        createPhysicalObject("spring_bottom_center", springGeom, springShape, springMat, new CANNON.Vec3(0.1, BIN_FLOOR_TOP + 0.04, 0.22), 1, true, [0, 0, Math.PI/2]);

        // D. 中央 T 形組合件 - 主箱體半高 0.1 -> Y = BIN_FLOOR_TOP + 0.1
        createCompoundObject("central_t_assembly");
    }

    // FIX: 原本這裡算出的 quat（eulerRot 疊加圓柱體軸向補償 baseQuat）只丟進 body.addShape()
    // 當作「shape 相對 body 的局部偏移」，卻從未指派給 body.quaternion 本身。
    // body.quaternion 預設是單位四元數，而渲染迴圈是用 mesh.quaternion.copy(body.quaternion)，
    // 結果視覺上的網格完全沒有套用到 eulerRot（軸、彈簧看起來會是直立，而不是設定的角度）；
    // 物理上，body 座標系（單位姿態）跟其上掛的、真正帶有偏移旋轉的 shape 從一開始就互相矛盾，
    // solver 從第一影格就會開始施加修正扭矩，導致模擬幾秒內物件被慢慢「扳」到不可預期的姿態
    // （實測 shaft_top 在 setting 3 秒後，軸向從「躺平」被轉到接近直立）。
    // 修法：把算好的旋轉直接指派給 body.quaternion，shape 本身不再帶額外的局部偏移。
    function createPhysicalObject(id, geometry, shape, color, position, mass, isCylinder = false, eulerRot = [0,0,0]) {
        const mesh = new THREE.Mesh(geometry, new THREE.MeshPhongMaterial({ color: color }));
        mesh.castShadow = true;
        scene.add(mesh);

        const body = new CANNON.Body({ mass: mass });
        const quat = new CANNON.Quaternion();
        quat.setFromEuler(eulerRot[0], eulerRot[1], eulerRot[2], 'XYZ');

        if (isCylinder) {
            const baseQuat = new CANNON.Quaternion();
            baseQuat.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            quat.mult(baseQuat, quat); 
        }

        body.quaternion.copy(quat);                 // <-- FIX: apply the computed rotation to the body itself
        body.addShape(shape, new CANNON.Vec3(0, 0, 0)); // shape now has no extra local-offset rotation
        body.position.copy(position);
        world.addBody(body);
        
        environmentObjects[id] = { mesh, body };
    }

    function createCompoundObject(id) {
        const compBody = new CANNON.Body({ mass: 5 });
        
        const boxShape = new CANNON.Box(new CANNON.Vec3(0.08, 0.1, 0.15));
        compBody.addShape(boxShape, new CANNON.Vec3(0.1, 0, 0));
        
        const cylShape = new CANNON.Cylinder(0.06, 0.06, 0.15, 16);
        const cylQuat = new CANNON.Quaternion();
        cylQuat.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), Math.PI / 2);
        compBody.addShape(cylShape, new CANNON.Vec3(-0.05, 0, 0), cylQuat);

        // FIX: 原本 y=0.1，箱體半高也是 0.1，代表底部剛好在 y=0（floor 頂面其實在 BIN_FLOOR_TOP=0.02），會卡進地板。
        compBody.position.set(0, BIN_FLOOR_TOP + 0.1, 0);
        world.addBody(compBody);

        const group = new THREE.Group();
        const boxMesh = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.2, 0.3), new THREE.MeshPhongMaterial({ color: 0x999999 }));
        boxMesh.position.set(0.1, 0, 0);
        boxMesh.castShadow = true;
        
        const cylMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.15, 32), new THREE.MeshPhongMaterial({ color: 0x0077ff }));
        cylMesh.rotation.z = Math.PI / 2;
        cylMesh.position.set(-0.05, 0, 0);
        cylMesh.castShadow = true;

        group.add(boxMesh);
        group.add(cylMesh);
        scene.add(group);

        environmentObjects[id] = { mesh: group, body: compBody };
    }

    function createGripper() {
        const group = new THREE.Group();
        const mat = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
        
        const base = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.05, 0.1), mat);
        base.position.y = 0.1;
        const fingerL = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.1), mat);
        fingerL.position.set(-0.09, 0, 0);
        const fingerR = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.1), mat);
        fingerR.position.set(0.09, 0, 0);

        group.add(base); group.add(fingerL); group.add(fingerR);
        scene.add(group);
        gripperMesh = group;

        gripperBody = new CANNON.Body({ 
            mass: 0, type: CANNON.Body.KINEMATIC, 
            shape: new CANNON.Box(new CANNON.Vec3(0.1, 0.1, 0.05)) 
        });
        gripperBody.position.copy(gripperTargetPos);
        world.addBody(gripperBody);
    }

    // ---- BT 資料載入 / 套用 ----

    function defaultBTData() {
        return {
            "Action": "Sequence",
            "Nodes": [
                {
                    "Node": "Sequence",
                    "Nodes": [
                        {
                            "Node": "FindGraspPoint",
                            "Target": "shaft_top",
                            "offset_xyz": [0, 0.05, -0.35],
                            "rot_euler": [0, 1.57, 0],
                            "drop_xyz": [-0.9, 0.15, -0.3]
                        }
                    ]
                }
            ]
        };
    }

    function loadBTData() {
        const rawData = localStorage.getItem('gdo_candidate_bt');
        if (rawData) {
            try {
                btData = JSON.parse(rawData);
            } catch (e) {
                console.warn('localStorage 內的 gdo_candidate_bt 不是合法 JSON，改用預設資料。', e);
                btData = defaultBTData();
            }
        } else {
            btData = defaultBTData();
        }
        document.getElementById('jsonDisplay').innerText = JSON.stringify(btData, null, 2);
        document.getElementById('btInput').value = JSON.stringify(btData, null, 2);
    }

    // FIX: 新增這一段 UI，讓貼在 textarea 裡的 JSON 真的會被拿去執行 —
    // 原本頁面只吃 localStorage，貼進去的 JSON 若沒有手動 localStorage.setItem() 是完全不會被用到的。
    function applyBTFromTextarea() {
        const msgEl = document.getElementById('loadMsg');
        const raw = document.getElementById('btInput').value;
        let parsed;
        try {
            parsed = JSON.parse(raw);
        } catch (e) {
            msgEl.textContent = 'JSON 解析失敗：' + e.message;
            msgEl.className = 'error';
            return;
        }
        if (!parsed || !Array.isArray(parsed.Nodes)) {
            msgEl.textContent = '格式錯誤：頂層物件需要有一個陣列欄位 "Nodes"。';
            msgEl.className = 'error';
            return;
        }
        btData = parsed;
        localStorage.setItem('gdo_candidate_bt', JSON.stringify(parsed));
        document.getElementById('jsonDisplay').innerText = JSON.stringify(btData, null, 2);
        msgEl.textContent = '已套用，共 ' + btData.Nodes.length + ' 個任務。按「執行全自動排程」開始。';
        msgEl.className = 'ok';
    }

    function clearStoredBT() {
        localStorage.removeItem('gdo_candidate_bt');
        const msgEl = document.getElementById('loadMsg');
        msgEl.textContent = '已清除，重新整理頁面將改用內建預設資料。';
        msgEl.className = 'ok';
    }

    async function executeBT() {
        if (isExecuting || !btData || !btData.Nodes) return;
        isExecuting = true;
        document.getElementById('runBtn').disabled = true;
        
        try {
            for (let i = 0; i < btData.Nodes.length; i++) {
                const task = btData.Nodes[i];
                if (!task.Nodes) continue;

                const graspNode = task.Nodes.find(n => n.Node === "FindGraspPoint");
                if (!graspNode) continue;

                const targetId = graspNode.Target;
                const offset = graspNode.offset_xyz || [0, 0, 0];
                const targetObj = environmentObjects[targetId];

                const rx = graspNode.rot_euler ? graspNode.rot_euler[0] : 0;
                const ry = graspNode.rot_euler ? graspNode.rot_euler[1] : 0;
                const rz = graspNode.rot_euler ? graspNode.rot_euler[2] : 0;

                const dropX = graspNode.drop_xyz ? graspNode.drop_xyz[0] : 0.9;
                const dropY = graspNode.drop_xyz ? graspNode.drop_xyz[1] : 0.15;
                const dropZ = graspNode.drop_xyz ? graspNode.drop_xyz[2] : 0;

                if (!targetObj) {
                    console.warn("找不到物件: " + targetId);
                    continue;
                }

                updateStatus(`[${i+1}/${btData.Nodes.length}] APPROACHING: ${targetId}`);
                await moveGripper(offset[0], 0.8, offset[2], rx, ry, rz, 0.05);
                await moveGripper(offset[0], offset[1], offset[2], rx, ry, rz, 0.02);

                updateStatus(`[${i+1}/${btData.Nodes.length}] GRASPING...`);
                await sleep(400);
                
                graspConstraint = new CANNON.LockConstraint(gripperBody, targetObj.body);
                world.addConstraint(graspConstraint);
                await sleep(200);

                updateStatus(`[${i+1}/${btData.Nodes.length}] LIFTING...`);
                await moveGripper(offset[0], 0.8, offset[2], rx, ry, rz, 0.03);

                updateStatus(`[${i+1}/${btData.Nodes.length}] MOVING TO DROP ZONE...`);
                await moveGripper(dropX, 0.8, dropZ, 0, 0, 0, 0.05);

                updateStatus(`[${i+1}/${btData.Nodes.length}] LOWERING TO PLACE...`);
                await moveGripper(dropX, dropY, dropZ, 0, 0, 0, 0.03);

                updateStatus(`[${i+1}/${btData.Nodes.length}] RELEASING...`);
                world.removeConstraint(graspConstraint);
                graspConstraint = null;
                await sleep(300);

                await moveGripper(dropX, 0.8, dropZ, 0, 0, 0, 0.05);
            }

            updateStatus("STATE: ALL TASKS ACCOMPLISHED");
            await moveGripper(0, 1.5, 0, 0, 0, 0, 0.05);
            
        } catch (e) {
            updateStatus("ERROR: " + e.message);
        } finally {
            isExecuting = false;
        }
    }

    function moveGripper(x, y, z, rx, ry, rz, speed) {
        return new Promise(resolve => {
            const targetP = new CANNON.Vec3(x, y, z);
            const targetQ = new CANNON.Quaternion();
            targetQ.setFromEuler(rx, ry, rz, 'XYZ');

            const interval = setInterval(() => {
                const diff = targetP.vsub(gripperTargetPos);
                const dist = diff.length();
                
                let posDone = false;
                if (dist <= speed) {
                    gripperTargetPos.copy(targetP);
                    posDone = true;
                } else {
                    diff.normalize();
                    gripperTargetPos.x += diff.x * speed;
                    gripperTargetPos.y += diff.y * speed;
                    gripperTargetPos.z += diff.z * speed;
                }

                slerpQuaternion(gripperTargetQuat, targetQ, 0.15, gripperTargetQuat);
                
                const dot = gripperTargetQuat.x * targetQ.x + 
                            gripperTargetQuat.y * targetQ.y + 
                            gripperTargetQuat.z * targetQ.z + 
                            gripperTargetQuat.w * targetQ.w;
                const rotDone = Math.abs(dot) > 0.99;

                if (posDone && rotDone) {
                    gripperTargetQuat.copy(targetQ); 
                    clearInterval(interval);
                    resolve();
                }
            }, 16);
        });
    }

    // FIX (夾具卡住的根因): cannon.js 0.6.2（本頁引用的版本）的 CANNON.Quaternion
    // 根本沒有 .slerp() 這個方法。原本 moveGripper() 每個 16ms tick 都會呼叫
    // gripperTargetQuat.slerp(...)，這行會拋出 "slerp is not a function"。
    // 這個例外發生在 setInterval callback 內部，不會被外層 executeBT() 的 try/catch
    // 捕捉到，也不會讓 moveGripper 回傳的 Promise reject——它就是單純「每 16ms 丟一次
    // 例外、永遠執行不到 resolve()」，於是 await moveGripper(...) 永遠卡住，夾具看起來
    // 就像動到一半突然凍結。這裡補一個手寫的 quaternion slerp（含最短路徑/dot<0 處理）取代它。
    function slerpQuaternion(qa, qb, t, target) {
        target = target || new CANNON.Quaternion();
        let cosHalfTheta = qa.x*qb.x + qa.y*qb.y + qa.z*qb.z + qa.w*qb.w;
        let bx = qb.x, by = qb.y, bz = qb.z, bw = qb.w;
        if (cosHalfTheta < 0) {
            bx = -bx; by = -by; bz = -bz; bw = -bw;
            cosHalfTheta = -cosHalfTheta;
        }
        if (cosHalfTheta >= 1.0) {
            target.x = qa.x; target.y = qa.y; target.z = qa.z; target.w = qa.w;
            return target;
        }
        const halfTheta = Math.acos(cosHalfTheta);
        const sinHalfTheta = Math.sqrt(1.0 - cosHalfTheta*cosHalfTheta);
        if (Math.abs(sinHalfTheta) < 0.001) {
            target.x = 0.5*(qa.x+bx); target.y = 0.5*(qa.y+by);
            target.z = 0.5*(qa.z+bz); target.w = 0.5*(qa.w+bw);
            return target;
        }
        const ratioA = Math.sin((1 - t) * halfTheta) / sinHalfTheta;
        const ratioB = Math.sin(t * halfTheta) / sinHalfTheta;
        target.x = qa.x*ratioA + bx*ratioB; target.y = qa.y*ratioA + by*ratioB;
        target.z = qa.z*ratioA + bz*ratioB; target.w = qa.w*ratioA + bw*ratioB;
        target.normalize();
        return target;
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
    function updateStatus(msg) { document.getElementById('statusDisplay').innerText = msg; }

    function animate() {
        requestAnimationFrame(animate);
        world.step(1 / 60);

        for (let key in environmentObjects) {
            const obj = environmentObjects[key];
            obj.mesh.position.copy(obj.body.position);
            obj.mesh.quaternion.copy(obj.body.quaternion);
        }

        gripperBody.position.copy(gripperTargetPos);
        gripperBody.quaternion.copy(gripperTargetQuat);
        gripperMesh.position.copy(gripperBody.position);
        gripperMesh.quaternion.copy(gripperBody.quaternion);

        renderer.render(scene, camera);
    }

    function onWindowResize() {
        const container = document.getElementById('canvas-container');
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    }
</script>
